  <style>
    :root { color: #7a2640; --paper: #f4f2ed; }
    @media (prefers-color-scheme: dark) { :root { color: #e69aaf; --paper: #0e0e0e; } }
    .motion { transform-origin: 64px 64px; animation: empty-motion 1.2s ease-out both; }
    @keyframes empty-motion { 0% { transform: translateY(4px) rotate(-5deg); } 55% { transform: translateY(-2px) rotate(2deg); } 100% { transform: none; } }

    .fill-window { transform-origin: 64px 112px; animation: fill-up 900ms cubic-bezier(.2,.7,.3,1) both; }
    @keyframes fill-up { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .badge { transform-origin: 105px 105px; animation: badge-in 450ms 400ms cubic-bezier(.2,.8,.3,1) both; }
    .badge path { stroke-dasharray: 1; animation: draw 500ms 650ms ease-out both; }
    @keyframes badge-in { from { transform: scale(.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .motion, .fill-window, .ink, .badge, .badge path { animation: none; }
      .motion, .badge { transform: none; opacity: 1; }
      .fill-window { transform: scaleY(1); }
      .ink { opacity: 1; }
      .badge path { stroke-dashoffset: 0; }
    }
  </style>
